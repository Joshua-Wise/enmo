# The web service of the root compose.yaml: the built frontend plus the /api/ proxy, on
# plain HTTP. Put TLS in front of the stack, not inside it (DEPLOYMENT.md).

# One zone for the live stream's per-address connection cap (location = /api/dashboard/stream).
limit_conn_zone $binary_remote_addr zone=sse_per_addr:1m;

# How the browser reached the site: https when the TLS proxy in front says so, else nginx's own
# scheme. It only decides whether the api marks the session cookie Secure (backend/src/sessions.ts),
# so a client claiming https over plain HTTP only stops its own browser sending its cookie back.
map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https   https;
}

server {
    # 8080, not 80: the image runs nginx as a non-root user, which cannot bind below 1024.
    # compose.yaml publishes it on WEB_PORT (80 by default), so operators see no change.
    listen 8080;
    server_name _;

    # No version in the Server header or on nginx's own error pages.
    server_tokens off;

    # Who the client is behind a TLS proxy: empty unless TRUST_PROXY names the proxy, then
    # set_real_ip_from for each address plus real_ip_header X-Forwarded-For, so $remote_addr
    # below is the browser. Written at start by real-ip.sh (/docker-entrypoint.d).
    include /tmp/real-ip.conf;

    # CSP, nosniff, Referrer-Policy, frame denial, Permissions-Policy (security-headers.conf).
    include /etc/nginx/snippets/security-headers.conf;

    # The API refuses bodies over 100 KB; nothing here needs nginx's 1 MB default.
    client_max_body_size 128k;

    root /usr/share/nginx/html;
    index index.html;

    # Compose's DNS. Resolving at request time lets nginx keep running while api is down
    # and follow api to a new address after `docker compose up --build` recreates it.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:3001;

    # The live stream holds a connection open for hours. Cap it per address here as well as in
    # the api (sse.ts, also 60), so one host cannot use up nginx's 1024 worker connections; each
    # stream takes two, client and upstream. The key is $remote_addr: behind a TLS proxy that is
    # the proxy, for every browser, unless TRUST_PROXY names it (DEPLOYMENT.md, TLS in front).
    location = /api/dashboard/stream {
        limit_conn sse_per_addr 60;
        limit_conn_status 429;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        # See /api/ below. No retry inside nginx: there is one api, and the browser's EventSource
        # retries (3 s, then use-reading-stream.ts reopens 5 s after a 502), so a fast 502 is the retry.
        proxy_connect_timeout 2s;
    }

    # Firmware: the Settings page uploads a signed build (about 430 KB) and boards download it
    # (docs/adr/0007), so this one route takes up to the 1 MB the api accepts for it.
    location = /api/firmware {
        client_max_body_size 1m;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_connect_timeout 2s;
    }

    # The rest of the backend API. ^~ so no asset rule below can outrank it.
    location ^~ /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        # $http_host keeps the port the browser used, so the backend's same-origin check
        # can match it against the Origin header without a CORS_ORIGIN setting.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Unbuffered with a long read timeout, as before the stream got its own location above.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        # A stopped or restarting api's address answers nothing, so nginx's 60 s default connect
        # held each request about 20 s and browsers took 30 s to get their streams back after an
        # api restart (.scratch/prodtest/resilience.md S3). On the compose bridge a healthy connect
        # takes under a millisecond, so 2 s only ever cuts a dead one short: a fast 502.
        # Not retried: one api, and a Reading is a POST, which nginx must not send twice.
        proxy_connect_timeout 2s;
    }

    # React Router: every unknown path serves index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The page names this build's hashed assets, so a browser must check it on every visit;
    # a stale copy after an upgrade asks for bundles the new image no longer has. The SPA
    # fallback above redirects here internally, so every route gets this header.
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Hashed build assets can be cached forever
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
